<!DOCTYPE html>
<html lang="en">
  <head>
    <title>WebVn</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=0.5" />
    <!-- Source Code Pro is the stage's; Source Sans 3 is the authoring chrome's, and is fetched
         here only - src/player.html has no chrome to render in it. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Code+Pro&family=Source+Sans+3:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Two views, one page. The picker is swapped in where the session would be - opening a project
         never reloads - so this is the seam and `hidden` is the swap. -->
    <div id="vn-picker"></div>
    <div id="vn-session" hidden>
      <div id="vn-session-bar">
        <button id="vn-btn-back" class="vn-chrome-button" type="button">Back to projects</button>
        <span id="vn-session-title"></span>
      </div>
      <div id="vn-div-container">
        <div id="vn-div">
          <div id="vn-actions">
            <div role="button" class="vn-action vn-action-back"><i class="gg-back-button"></i>Back</div>
            <div role="button" class="vn-action vn-action-menu"><i class="gg-menu"></i>Menu</div>
            <div role="button" class="vn-action vn-action-auto">Auto<i class="gg-play-button"></i></div>
            <div role="button" class="vn-action vn-action-skip">
              Skip<span style="width: 20px; transform: translateX(14px)"><i class="gg-play-forwards"></i></span>
            </div>
          </div>
        </div>
      </div>
      <!-- What the session can do with the project that is open. "Export ZIP" names the format
           because it sits beside a button that also emits something - a link - and "Export" alone
           would not say which; the link button says "Copy player link" because CONTEXT.md reserves
           *export* for the archive that carries the assets. -->
      <div id="vn-session-tools">
        <button id="vn-btn-fullscreen" class="vn-chrome-button" type="button">Fullscreen</button>
        <button id="vn-btn-copy-player-link" class="vn-chrome-button" type="button">Copy player link</button>
        <button id="vn-btn-export-zip" class="vn-chrome-button" type="button">Export ZIP</button>
        <span id="vn-btn-copy-player-link-message"></span>
      </div>
      <div id="vn-editor"></div>
      <div id="vn-jump-mode">
        Jump mode:
        <label>replay <input type="radio" name="vn-jump-mode" value="replay" checked /></label>
        <label>direct <input type="radio" name="vn-jump-mode" value="direct" /></label>
      </div>
      <div id="vn-state"></div>
      <div id="vn-variables"></div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
