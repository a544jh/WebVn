formatVersion: 1
id: webvn-demo
title: WebVn Demo

actors:
  narrator:
    textColor: "#60baff"
  A1:
    name: Actor
    nameTagColor: purple
    sprites:
      idle: idle.png
      "2": "2.png"
  A2:
    name: Actor2
    nameTagColor: orange
    sprites:
      idle: idle.png
      "2": "2.png"
  # Declared and nothing more, which is the whole of what an actor with no styling needs: the script
  # speaks as Rando and the engine's default actor supplies the rest. An id no declaration answers is
  # a warning against the line that named it, so a cast member gets an entry even when it is empty.
  Rando: {}

backgrounds:
  a: a.png
  b: b.png

# A bare string is the whole declaration when there is nothing to credit; the pause menu shows the
# title and artist of whichever track is playing.
audioAssets:
  map01: bgm/map01.ogg
  daylight:
    file: bgm/dayl_preview.ogg
    title: Daylight - 8bit remix
    artist: a544jh
  bigthump: sfx/bigthump.ogg
