name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A new push to the same branch supersedes whatever is already running.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, format, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run prettier
      - run: npm run typecheck
      - run: npm run build

  test:
    name: Unit + browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The browser cache holds ~/.cache/ms-playwright only. The apt system
      # libraries live outside it, so install-deps still runs on a cache hit.
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - run: npm test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-screenshots
          path: src/**/__screenshots__/
          if-no-files-found: ignore

  demo:
    # Full playthroughs of the demo story, waiting on real CSS transitions
    # (~35s). Kept as its own job so a timing flake here reads as "demo red"
    # rather than poisoning the fast gate.
    name: Demo playthrough
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - run: npm run test:demo

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: demo-failure-screenshots
          path: src/**/__screenshots__/
          if-no-files-found: ignore
