# The demo story. Every asset it names is an id declared in manifest.yaml, beside this file.
anchor: &anchor
  A1: "This is a YAML anchor"

story:
  - set: [$a, =, 0]
  - textbox: close
  - bg:
      image: a
      transition: blinds
      duration: 2000
      pan:
        from: [0,0,100,100]
        to: [0,0,2000,2000]
        duration: 10000
  - Hello, This is WebVn - A fast visual novel engine for the modern web.
  - The quick brown fox jumps over the lazy dog. The quick brown fox jumps over the lazy dog. The quick brown fox jumps over the lazy dog. The quick brown fox jumps over the lazy dog. The quick brown fox jumps over the lazy dog. The quick brown fox jumps over the lazy dog.
  - bgm:
      audio: map01
      loop: false
  - bg:
      image: b
      transition: fade
      duration: 2000
      pan:
        from: [0,0,100,100]
        to: [0,0,1000,1000]
        duration: 10000
  - "Wait for audio to stop"
  - bgm: map01
  - Looping audio
  - bgm: daylight
  - Another song...
  - bgm: stop
  - And now... Actors!
  - label: loop
  - show:
      actor: A1
      sprite: idle
  - A1: Here I am
  - show:
      actor: A1
      sprite: "2"
      x: .2
  - A1: Just talking...
  - bgm: daylight
  - bgPan:
      to: [20,20,500,500]
      duration: 2000
  - show:
      actor: A2
      sprite: idle
      x: 0
      y: 0
      anchorX: 0
      anchorY: 0
  - A2: And here I come
  - set: [$a, +=, 1]
  - show:
      actor: A2
      sprite: idle
      x: 1
      y: 1
      anchorX: 1
      anchorY: 1
  - A2: Whee!
  - A2: Bye
  - hide: A2
  - A1: One sprite can be on screen many times at once - each show names its own id.
  - show:
      id: crowd-1
      actor: A2
      sprite: idle
      x: .2
      y: .9
      anchorY: 1
  - show:
      id: crowd-2
      actor: A2
      sprite: idle
      x: .4
      y: .9
      anchorY: 1
  - show:
      id: crowd-3
      actor: A2
      sprite: idle
      x: .6
      y: .9
      anchorY: 1
  - show:
      id: crowd-4
      actor: A2
      sprite: idle
      x: .8
      y: .9
      anchorY: 1
  - A1: And each is hidden by the id it was shown under.
  - hide: crowd-1
  - hide: crowd-2
  - hide: crowd-3
  - hide: crowd-4
  - Bye bye, actors
  - hide: A1
  - Let's enter freeform mode!
  - mode: freeform
  - Wheee!
  - Eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee (should be appended!)
  - freeformPos:
      x: .5
      y: .5
      width: .2
  - I'm a new box
  - That also has text appended to it!
  - freeformPos:
      x: .2
      y: .2
      width: .2
  - Yet another one!
  - A1: Actors can talk too!
  - Not let's clear everything
  - textbox: clear
  - And a new box should appear now
  - And back to ADV mode!
  - mode: adv
  - Hello again!
  - Let's try some jumps
  - jump:
      to: loop
      if: [$a, ==, 1]
  - ugh: this is an unregonized command
  - textbox: close
  - *anchor
  - bgm: stop
  - bg:
      image: "#000000"
      transition: blinds
      duration: 1000
  - bg:
      image: b
      transition: blinds
      duration: 1000
  - mode: adv
  - What decision are you going to make?
  - decision:
    - "asd: asd (quoted string)":
        jump: asd
    - A bad one.:
        jump: bad
  - label: asd
  - More YAML quoting tests...
  - 2
  - "2"
  - no
  - false
  - "Quoted"
  - |
    This is a
    Multiline
    Node
  - Rando: I'm just some random dude
  - A1: But I'm a defined actor
  - textbox: close
  - jump: loop
  - label: bad
  - sfx: bigthump
  - bg:
      image: "#ffffff"
      transition: fade
      duration: 200
  - bg:
      image: b
      transition: fade
      duration: 200
  - That was a bad choice.
  - And here we go again...
  - jump: loop
